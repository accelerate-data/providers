name: Build and Push providers-vibedata

permissions:
  contents: read
  packages: write
  id-token: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - docs/**
      - .github/workflows/**

env:
  PROVIDERS_IMAGE: ghcr.io/accelerate-data/providers-vibedata
  ENCRYPTION_BINS_IMAGE: ghcr.io/accelerate-data/providers-vibedata/encryption-bins

jobs:
  context:
    name: Build context
    runs-on: ubuntu-latest
    outputs:
      upstream_sha: ${{ steps.ctx.outputs.upstream_sha }}
      fork_sha: ${{ steps.ctx.outputs.fork_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Emit build context
        id: ctx
        env:
          PROVIDERS_IMAGE: ${{ env.PROVIDERS_IMAGE }}
          ENCRYPTION_BINS_IMAGE: ${{ env.ENCRYPTION_BINS_IMAGE }}
        run: bash scripts/build-vibedata-providers.sh

  build:
    name: Build (${{ matrix.arch }})
    needs: context
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build providers by digest
        id: providers
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          target: providers
          outputs: type=image,name=${{ env.PROVIDERS_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Build encryption-bins by digest
        id: encryption-bins
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          target: encryption-bins
          outputs: type=image,name=${{ env.ENCRYPTION_BINS_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Save digests
        run: |
          mkdir -p /tmp/digests/providers /tmp/digests/encryption-bins
          echo "${{ steps.providers.outputs.digest }}"       > /tmp/digests/providers/${{ matrix.arch }}
          echo "${{ steps.encryption-bins.outputs.digest }}" > /tmp/digests/encryption-bins/${{ matrix.arch }}

      - name: Upload digest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: providers-digests-${{ matrix.arch }}
          path: /tmp/digests
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Merge manifests
    needs: [context, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      providers_digest: ${{ steps.manifest.outputs.providers_digest }}
      encryption_digest: ${{ steps.manifest.outputs.encryption_digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: providers-digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create manifest lists
        id: manifest
        run: |
          set -euo pipefail

          merge() {
            local image="$1" dir="$2" outkey="$3"
            local srcs=""
            for f in /tmp/digests/"$dir"/*; do
              srcs="$srcs ${image}@$(cat "$f")"
            done
            docker buildx imagetools create -t "${image}:latest" $srcs
            local digest
            digest="$(docker buildx imagetools inspect "${image}:latest" \
              --format '{{println .Manifest.Digest}}' | head -1 | tr -d '[:space:]')"
            echo "${outkey}=${digest}" >> "$GITHUB_OUTPUT"
            echo "${image}:latest digest: ${digest}"
          }

          merge "${{ env.PROVIDERS_IMAGE }}"       providers       providers_digest
          merge "${{ env.ENCRYPTION_BINS_IMAGE }}" encryption-bins encryption_digest

      - name: Verify both arches present
        run: |
          set -euo pipefail
          for image in "${{ env.PROVIDERS_IMAGE }}" "${{ env.ENCRYPTION_BINS_IMAGE }}"; do
            INSPECT="$(docker buildx imagetools inspect "${image}:latest")"
            echo "$INSPECT"
            echo "$INSPECT" | grep -q 'linux/amd64' || { echo "::error::${image}:latest missing linux/amd64"; exit 1; }
            echo "$INSPECT" | grep -q 'linux/arm64' || { echo "::error::${image}:latest missing linux/arm64"; exit 1; }
          done

      - name: Write summary
        env:
          UPSTREAM_SHA: ${{ needs.context.outputs.upstream_sha }}
          FORK_SHA: ${{ needs.context.outputs.fork_sha }}
        run: |
          {
            echo "### :whale: providers-vibedata published"
            echo ""
            echo "| Signal | Value |"
            echo "| --- | --- |"
            echo "| Upstream providers SHA | \`${UPSTREAM_SHA}\` |"
            echo "| Fork providers SHA | \`${FORK_SHA}\` |"
            echo "| providers-vibedata digest | \`${{ steps.manifest.outputs.providers_digest }}\` |"
            echo "| encryption-bins digest | \`${{ steps.manifest.outputs.encryption_digest }}\` |"
            echo "| Run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1
        with:
          cosign-release: "v2.4.3"

      - name: Sign images
        env:
          PROVIDERS_DIGEST: ${{ steps.manifest.outputs.providers_digest }}
          ENCRYPTION_DIGEST: ${{ steps.manifest.outputs.encryption_digest }}
        run: |
          cosign sign --yes "${{ env.PROVIDERS_IMAGE }}:latest@${PROVIDERS_DIGEST}"
          cosign sign --yes "${{ env.ENCRYPTION_BINS_IMAGE }}:latest@${ENCRYPTION_DIGEST}"
