name: Build providers

permissions:
  id-token: write
  contents: read
  packages: write

env:
  PROVIDERS_IMAGE: ghcr.io/accelerate-data/providers-vibedata

on:
  workflow_dispatch:

jobs:
  oss-providers-build:
    runs-on: ubuntu-latest
    concurrency:
      group: oss-providers-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        id: build-and-push
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          target: providers
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ github.ref_type == 'tag' && format('{0}:{1}', env.PROVIDERS_IMAGE, github.ref_name) || format('{0}:latest', env.PROVIDERS_IMAGE) }}

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3.8.1
        with:
          cosign-release: "v2.4.3"

      - name: Sign Images
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAGS: ${{ github.ref_type == 'tag' && format('{0}:{1}', env.PROVIDERS_IMAGE, github.ref_name) || format('{0}:latest', env.PROVIDERS_IMAGE) }}
        run: |
          images=""
          for tag in ${TAGS}; do
            images+="${tag}@${DIGEST} "
          done
          cosign sign --yes ${images}
